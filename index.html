<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Packfinder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar, filter column on the left, result grid on the right; stacks below 860px. */
:root {
  --bg: #e9ece6;
  --surface: #f7f8f4;
  --sunk: #dfe3db;
  --ink: #18201a;
  --muted: #5a665d;
  --line: #cfd5cb;
  --accent: #2e7a3b;
  --accent-ink: #ffffff;
  --accent-soft: #d3e6d2;
  --mr: #10994c;
  --cf: #cf5223;
  --warn: #9a6200;
  --danger: #b3261e;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #181d1a; --sunk: #0d100e; --ink: #e2e8e0; --muted: #93a197;
    --line: #2a322c; --accent: #5cbf69; --accent-ink: #0b120c; --accent-soft: #1e3322;
    --mr: #36d27c; --cf: #f07a45; --warn: #e0a640; --danger: #f2867e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181d1a; --sunk: #0d100e; --ink: #e2e8e0; --muted: #93a197;
  --line: #2a322c; --accent: #5cbf69; --accent-ink: #0b120c; --accent-soft: #1e3322;
  --mr: #36d27c; --cf: #f07a45; --warn: #e0a640; --danger: #f2867e; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
  padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font: 700 1.35rem/1 var(--font-display); letter-spacing: .01em; margin-right: auto; }
.brand-mark { width: 22px; height: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.brand-mark i { background: var(--accent); border-radius: 1px; }
.brand-mark i:nth-child(2), .brand-mark i:nth-child(4), .brand-mark i:nth-child(9) { opacity: .45; }
.brand small { font: 500 .72rem var(--font-mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--sunk); }
.seg button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 7px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 -2px 0 var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.mr { background: var(--mr); } .dot.cf { background: var(--cf); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 7px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 24px; padding: 20px; max-width: 1500px; margin: 0 auto; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 16px; } }

.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.filters > summary { list-style: none; cursor: pointer; padding: 12px 16px; font: 600 1rem var(--font-display); display: flex; justify-content: space-between; align-items: center; }
.filters > summary::-webkit-details-marker { display: none; }
.filters > summary::after { content: "▾"; color: var(--muted); }
.filters[open] > summary::after { content: "▴"; }
@media (min-width: 861px) { .filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 96px); overflow-y: auto; } }
.filters form { display: flex; flex-direction: column; gap: 18px; padding: 4px 16px 18px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.label { font: 500 .72rem var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.hint { font-size: .8rem; color: var(--muted); margin: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); min-width: 0; }
.field:focus { border-color: var(--accent); outline: none; }
.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
.check input { accent-color: var(--accent); }
.feature { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.feature .label { color: var(--accent); }
.mini-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.mini-seg button { border: 0; background: var(--surface); padding: 1px 8px; font: 500 .72rem var(--font-mono); cursor: pointer; }
.mini-seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.picker { position: relative; }
.pick-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 28px rgb(0 0 0 / .18); max-height: 320px; overflow-y: auto; padding: 4px; }
.pick-item { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: transparent; text-align: left; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.pick-item:hover, .pick-item:focus-visible { background: var(--sunk); }
.pick-item img, .pick-item .noimg { width: 26px; height: 26px; border-radius: 4px; flex: none; object-fit: cover; background: var(--sunk); }
.pick-item span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.pick-item em { font: .7rem var(--font-mono); color: var(--muted); font-style: normal; }
.pick-empty { padding: 8px; color: var(--muted); font-size: .85rem; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); font-size: .85rem; max-width: 100%; }
.chip.ex { border-style: dashed; }
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .links { display: inline-flex; gap: 3px; }
.chip .links b { font: 600 .6rem var(--font-mono); padding: 0 3px; border-radius: 2px; color: var(--surface); }
.chip .links b.mr { background: var(--mr); } .chip .links b.cf { background: var(--cf); }
.chip .links b.off { background: transparent; color: var(--muted); text-decoration: line-through; }
.chip .links b.wait { background: var(--line); color: var(--muted); }
.chip button { border: 0; background: transparent; cursor: pointer; padding: 0 4px; color: var(--muted); font-size: 1rem; line-height: 1; }
.chip button:hover { color: var(--danger); }

.cats { display: flex; flex-wrap: wrap; gap: 5px; }
.cat { border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 2px 8px; font-size: .8rem; cursor: pointer; text-transform: capitalize; }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.submit-row { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--surface); padding-top: 8px; }
.submit-row .btn.primary { flex: 1; }

.results { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.status { font: .85rem var(--font-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; min-width: 0; }
.status strong { color: var(--ink); font-weight: 500; }
.status .src { display: inline-flex; align-items: center; gap: 6px; }
.spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.notes { display: flex; flex-direction: column; gap: 6px; }
.note { border-left: 3px solid var(--warn); background: var(--surface); padding: 8px 12px; font-size: .88rem; border-radius: 0 var(--radius) var(--radius) 0; }
.note.err { border-left-color: var(--danger); }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .88rem; color: var(--muted); }
.suggest button { border: 1px dashed var(--accent); background: transparent; color: var(--accent); border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: .85rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card-head { display: flex; gap: 12px; min-width: 0; }
.card-head img, .card-head .noimg { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; flex: none; background: var(--sunk); image-rendering: auto; }
.card-title { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card-title a { font: 600 1.05rem/1.25 var(--font-display); text-decoration: none; overflow-wrap: anywhere; }
.card-title a:hover { text-decoration: underline; }
.by { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.src-tag { font: 600 .62rem var(--font-mono); text-transform: uppercase; letter-spacing: .06em; padding: 1px 5px; border-radius: 3px; color: var(--surface); }
.src-tag.modrinth { background: var(--mr); } .src-tag.curseforge { background: var(--cf); }
